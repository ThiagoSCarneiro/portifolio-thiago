<a class="skip" href="#conteudo-principal">Ir para o conteúdo</a>

<header class="head" role="banner">
  <div class="head__inner">
    <a class="head__brand" routerLink="/" (click)="closeMenu()">{{ brand() }}</a>

    <button
      type="button"
      class="head__menu-btn"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-nav-panel"
      [attr.aria-label]="menuOpen() ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <svg class="head__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
          />
        </svg>
      } @else {
        <svg class="head__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M3 18h18v-2H3zm0-5h18v-2H3zm0-7v2h18V6z" />
        </svg>
      }
    </button>

    <nav
      class="head__nav"
      [class.head__nav--open]="menuOpen()"
      id="site-nav-panel"
      aria-label="Seções do portfólio"
    >
      <ul class="head__list">
        @for (item of navItems(); track item.fragment) {
          <li>
            <a
              class="head__link"
              [routerLink]="['/']"
              [fragment]="item.fragment"
              (click)="closeMenu()"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
